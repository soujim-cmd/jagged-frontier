<svg viewBox="0 0 980 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl desc" font-family="DM Sans, system-ui, sans-serif">
<title id="ttl">The learning layer: boundary, three clocks, and the gate logic</title>
<desc id="desc">Three bands. Top band, milliseconds: a human work surface we build, plus three existing systems we integrate with, the agent, the system of work, and the system of record. Everything drains into the middle band, the private engine, holding the outcome graph, the linkage step that joins an action to its outcome, and pattern derivation which requires a minimum sample, tier A signals, and a confidence floor. That flows to the bottom band, governance on a weekly to quarterly clock: an evidence pack, a named approver, and an owner who audits. Approved policy returns to the agent as its default and is retired when results stop holding.</desc>

